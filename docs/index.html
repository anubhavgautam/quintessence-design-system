/* ───────── GETTING STARTED ───────── */
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const code = (name, src) => {
  let s = esc(src.replace(/^\n/, '').replace(/\n\s*$/, ''));
  s = s.replace(/(&lt;!--[\s\S]*?--&gt;|\/\*[\s\S]*?\*\/|(^|\s)#(?!\w).*$|(^|[^:])\/\/.*$)/gm, (m) => '<span class="c">' + m + '</span>');
  return '<figure class="code">' + (name ? '<figcaption class="label">' + name + '</figcaption>' : '') + '<pre>' + s + '</pre></figure>';
};
const REPO = 'https://github.com/anubhavgautam/quintessence-design-system';
const CDN = 'https://cdn.jsdelivr.net/gh/anubhavgautam/quintessence-design-system@v1.1.0/dist';

P['start'] = { crumb: ['Getting started'], title: 'Using Quintessence', lede: 'Quintessence is a small, opinionated system for sites where photographs are the content. This is how to put it on a page, build inside its rules, and know when you are done.', body: `
<section class="s" id="box"><h2 class="sh">What’s in the box</h2><div class="prose"><p>Two files do the work. Nothing needs a build step, a package manager, or a framework — though all three are welcome.</p></div>
<div class="tbl-wrap"><table class="t"><thead><tr><th>File</th><th>What it is</th><th>Weight</th></tr></thead><tbody>
<tr><td>dist/quintessence.css</td><td>All 62 tokens for both themes, the reset, and the kit: <code>.btn-neu</code>, <code>.circle</code>, <code>.pill</code>, <code>.panel</code>, <code>.well</code>, <code>.frost</code>, <code>.label</code>, <code>.numeral</code>, <code>.badge</code>, <code>.theme-toggle</code>, <code>.grain</code>, plus reveal-on-scroll and <code>.sr-only</code>.</td><td class="mono">~18 KB</td></tr>
<tr><td>dist/quintessence.js</td><td>Sets the theme before first paint (saved choice, else time of day), binds any <code>[data-theme-toggle]</code>, and reveals <code>[data-reveal]</code> elements as they scroll in. No dependencies.</td><td class="mono">~3 KB</td></tr>
<tr><td>docs/index.html</td><td>This site. A single file — open it from disk, host it anywhere.</td><td class="mono">—</td></tr>
<tr><td>examples/starter.html</td><td>A page that uses everything above, in the right order. Copy it to begin.</td><td class="mono">—</td></tr>
</tbody></table></div></section>

<section class="s" id="for"><h2 class="sh">What it is for</h2><div class="prose"><p>The system has one accent, one typeface, and a grammar where elevation means something. Those are strengths on the right kind of page and a straitjacket on the wrong one.</p></div>
${dd('<p>Portfolio and gallery sites, where the picture is the point.</p><p>Small tools that live beside them — the site’s admin panel is built from the same eleven classes.</p><p>Anything that should feel like paper, a print, a light table.</p>', '<p>Dashboards, forms-heavy apps, anything with a second brand colour.</p><p>Pages that need semantic colour (success, warning, danger). The system has ink and one red.</p><p>If you need a second typeface, this is the wrong system — do not fork it into one.</p>')}</section>

<section class="s" id="ways"><h2 class="sh">Three ways in</h2>
<div class="ways">
<div class="way"><span class="label">Clone it</span><h3>From the repository</h3><p>Nothing to install or build. Clone, open <code>examples/starter.html</code>, start editing. In a project of your own, pin it as a submodule and link <code>dist/</code> with relative paths.</p>${code('', `git clone ${REPO}.git
# or, pinned inside your project:
git submodule add ${REPO}.git vendor/quintessence`)}</div>
<div class="way"><span class="label">Install it</span><h3>From GitHub, via npm</h3><p>Pin a tag. Then import the stylesheet wherever your bundler collects CSS and copy the script into your HTML head.</p>${code('', `npm i github:anubhavgautam/quintessence-design-system#v1.1.0

# in your entry file
import 'quintessence-design-system/dist/quintessence.css';`)}</div>
<div class="way"><span class="label">Link it</span><h3>From a CDN</h3><p>Two tags, nothing to install. jsDelivr serves the repository directly; pin the tag.</p>${code('', `<script src="${CDN}/quintessence.js"><\/script>
<link rel="stylesheet" href="${CDN}/quintessence.css">`)}</div>
</div></section>

<section class="s" id="first"><h2 class="sh">The first page</h2><div class="prose"><p>This is <code>examples/starter.html</code> with the furniture removed. The order in <code>&lt;head&gt;</code> is the whole trick: the script runs before anything paints, so the visitor never sees the wrong theme; your own styles come last so they win ties.</p></div>
${code('index.html', `<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your site</title>

  <!-- 1. Runtime first, blocking: stamps data-theme before first paint -->
  <script src="quintessence/quintessence.js"><\/script>

  <!-- 2. The typeface: DM Sans 400 / 500 / 600 with optical sizing -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap">

  <!-- 3. The system -->
  <link rel="stylesheet" href="quintessence/quintessence.css">

  <!-- 4. Your page — tokens only -->
  <style>
    .page { position: relative; z-index: 1; max-width: 1040px; margin: 0 auto; padding: var(--space-8) var(--space-6); }
  </style>
</head>
<body>
  <div class="page">
    <button class="theme-toggle" type="button" data-theme-toggle aria-label="Toggle colour theme">
      <span class="theme-toggle__knob" aria-hidden="true"></span>
    </button>
    <h1 data-reveal>Photographs first.</h1>
    <button class="btn-neu pill" type="button">Open the album</button>
  </div>
  <div class="grain" aria-hidden="true"></div>   <!-- 5. Last in body -->
</body>
</html>`)}
<div class="prose"><p>Open it in a browser. The ground is <code>#ececef</code> by day and <code>#0a0a0a</code> after 18:00; the toggle remembers what you choose; the button presses. If any of those three did not happen, see <a href="#/start/install#verify"><b>Check it took</b></a>.</p></div></section>
${rel(['start/install','Install'], ['start/build','Build with it'], ['start/checklist','Ship checklist'], ['principles','Principles'])}` };

P['start/install'] = { crumb: ['Getting started'], title: 'Install', lede: 'Four things go in the head, in this order, and one div goes at the end of the body. Ten minutes, no build step.', body: `
<section class="s" id="order"><h2 class="sh">Order matters</h2>
<ol class="steps">
<li><h3>The runtime</h3><p>A plain <code>&lt;script src&gt;</code> in <code>&lt;head&gt;</code> — not <code>defer</code>, not <code>async</code>, not in your bundle. It must run before the first paint so the theme is stamped on <code>&lt;html&gt;</code> before the stylesheet applies. Without it the page still works: the stylesheet follows the OS instead of the clock, and content marked <code>data-reveal</code> is simply visible.</p>${code('', `<script src="quintessence/quintessence.js"><\/script>`)}</li>
<li><h3>The typeface</h3><p>The stylesheet names DM Sans and falls back to the system stack; it does not load it. Load the three weights the system uses and nothing else. The variable <code>opsz</code> axis is what makes 10.5px labels and 56px display type come from the same file and still look right.</p>${code('', `<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap">`)}</li>
<li><h3>The stylesheet</h3><p>Tokens, reset, kit. It sets the ground and ink on <code>&lt;html&gt;</code> and <code>&lt;body&gt;</code>, the focus ring, the selection colour, and the cross-fade between themes.</p>${code('', `<link rel="stylesheet" href="quintessence/quintessence.css">`)}</li>
<li><h3>Your own styles</h3><p>After the system, so that at equal specificity yours win. Read tokens; never write a value the system already names. The kit classes are single-class selectors on purpose — one class of your own overrides any of them.</p></li>
<li><h3>The grain</h3><p>Last child of <code>&lt;body&gt;</code>, and wrap everything else in an element with <code>position: relative; z-index: 1</code> so the grain sits behind the page, not on it. It is the one thing that makes a flat grey ground read as paper.</p>${code('', `<div class="grain" aria-hidden="true"></div>`)}</li>
</ol></section>

<section class="s" id="theme"><h2 class="sh">Wire the theme switch</h2><div class="prose"><p>Any element with <code>data-theme-toggle</code> becomes a switch: the runtime sets its <code>aria-pressed</code> (true means dark) and flips the theme on click. The saved choice lives in <code>localStorage</code> under <code>theme</code> and wins over the clock on every later visit.</p></div>
${code('', `<button class="theme-toggle" type="button" data-theme-toggle aria-label="Toggle colour theme">
  <span class="theme-toggle__knob" aria-hidden="true"></span>
</button>`)}
<div class="prose"><p>For your own scripts, the same functions are on <code>window.Quintessence.theme</code>:</p></div>
${code('', `Quintessence.theme.get()        // 'light' | 'dark'
Quintessence.theme.set('dark')  // applies and remembers
Quintessence.theme.toggle()
Quintessence.theme.resolve()    // what a first-time visitor would get right now`)}
${dd('<p>One switch per page, in the header, at its natural 60 × 30. On the site it also plays a switch sound.</p>', '<p>Do not add a third “system” option. The clock is the system default; the switch is for overriding it.</p>')}</section>

<section class="s" id="frameworks"><h2 class="sh">In a framework</h2><div class="prose"><p>Nothing is framework-specific — the system is classes, attributes, and custom properties. Two things to get right: the runtime must still be a blocking script in the document head, and it must re-bind after a client-side navigation.</p></div>
<h3 class="sh3">Astro</h3>${code('src/layouts/Base.astro', `---
import 'quintessence-design-system/dist/quintessence.css';
import runtime from 'quintessence-design-system/dist/quintessence.js?raw';

<div class="prose"><p>The runtime already listens for <code>astro:page-load</code>, so the theme switch and reveals survive view transitions without more code.</p></div>
<h3 class="sh3">Vite, Next, anything bundled</h3><div class="prose"><p>Import the stylesheet in your entry file. Put the script tag in the HTML template’s head — not in the bundle, or it will run after paint. After a client-side route change, call <code>Quintessence.bind()</code> once.</p></div></section>

<section class="s" id="verify"><h2 class="sh">Check it took</h2><div class="prose"><p>Three checks in the console, in order. Each one only passes if the step before it did.</p></div>
${code('', `document.documentElement.dataset.theme          // 'light' or 'dark' — the runtime ran before paint
getComputedStyle(document.body).fontFamily       // begins with "DM Sans" — the font loaded
getComputedStyle(document.body).backgroundColor  // rgb(236, 236, 239) or rgb(10, 10, 10) — the stylesheet applied`)}
<div class="prose"><p>Then flip the switch and reload: the theme you chose should be there before the page finishes loading, with no flash of the other.</p></div></section>
${rel(['start/build','Build with it'], ['language/theming','Theming'], ['patterns/time-theme','Time-of-day theme'], ['components/theme-switch','Theme switch'])}` };

P['start/build'] = { crumb: ['Getting started'], title: 'Build with it', lede: 'Everything you make reads tokens and picks a surface by grammar. Here is the kit, a worked example, and how to add to the system without diluting it.', body: `
<section class="s" id="tokens"><h2 class="sh">Read tokens, never values</h2><div class="prose"><p>A raw hex, millisecond, or pixel radius belongs in exactly one place: the <code>:root</code> blocks of the stylesheet. Everywhere else, name the role. This is what lets one attribute on <code>&lt;html&gt;</code> re-theme the whole page, and what keeps a new component from drifting a shade or a few milliseconds away from the rest.</p></div>
<div class="dd"><div class="dd__col"><span class="label">Do</span>${code('', `.caption {
  color: var(--text-muted);
  font-size: var(--font-size-xs);
  border-radius: var(--radius-chip);
  transition: opacity var(--dur-hover) var(--ease-out);
}`)}</div><div class="dd__col dd__col--dont"><span class="label">Don’t</span>${code('', `.caption {
  color: #666;
  font-size: 12px;
  border-radius: 8px;
  transition: opacity 0.2s ease;
}`)}</div></div>
<div class="prose"><p>The two render identically today. Only the first one still will after the next change to the system. The complete list is on <a href="#/tokens"><b>All tokens</b></a>.</p></div></section>

<section class="s" id="grammar"><h2 class="sh">Pick the surface by grammar</h2><div class="prose"><p>Elevation is the system’s only ornament, and it always means something. Before you style a thing, decide which of three it is.</p></div>
<div class="stage"><button class="btn-neu pill" type="button">Raised — press me</button><span class="well pill" style="color:var(--text-secondary)">Recessed — holds state</span><span style="font-size:14px;color:var(--text-secondary)">Flat — content</span></div>
<div class="tbl-wrap"><table class="t t--plain"><thead><tr><th>Surface</th><th>Meaning</th><th>Class</th><th>Test</th></tr></thead><tbody>
<tr><td>Raised</td><td>Something happens when you press it.</td><td class="mono">.btn-neu · .panel</td><td>Click it. If nothing happens, it should not be raised.</td></tr>
<tr><td>Recessed</td><td>Holds a state or a read-only label.</td><td class="mono">.well · .badge · toggle track</td><td>It never has a click handler.</td></tr>
<tr><td>Flat</td><td>Content — text, a photograph.</td><td class="mono">none</td><td>No shadow, no fill. The grain is its texture.</td></tr>
</tbody></table></div></section>

<section class="s" id="kit"><h2 class="sh">The kit</h2><div class="prose"><p>Eleven classes. Each is a single-class selector so one class of your own can override it, and each combines with the others by stacking — <code>class="btn-neu circle circle--sm"</code> is an icon button.</p></div>
<div class="tbl-wrap"><table class="t"><thead><tr><th>Class</th><th>What it is</th><th>Put it on</th></tr></thead><tbody>
<tr><td>.btn-neu</td><td>The raised, pressable surface with hover, press, and held (<code>aria-pressed</code>) states.</td><td>Any <code>&lt;button&gt;</code> or <code>&lt;a&gt;</code>. Always with <code>.circle</code> or <code>.pill</code>.</td></tr>
<tr><td>.circle --sm --md --lg</td><td>36 / 42 / 46px circular control. The three sizes are the only three.</td><td>Icon actions · menu items · the one floating control.</td></tr>
<tr><td>.pill</td><td>A control that carries words. 14px medium, 9 × 16 padding.</td><td>Text buttons, the tilt prompt, related links.</td></tr>
<tr><td>.panel</td><td>A raised 14px surface that holds a group of content.</td><td>Cards, rows, a settings group. Add hover only if the whole thing is a link.</td></tr>
<tr><td>.well</td><td>The recessed surface.</td><td>Tracks, status chips, the active item in a nav.</td></tr>
<tr><td>.frost</td><td>Translucent, blurred ground for chrome that floats over a photograph.</td><td>Sticky bars, the floating pill.</td></tr>
<tr><td>.label</td><td>The one uppercase voice: 10.5px, 0.12em, muted, tabular.</td><td>Eyebrows, stamps, index lines, table captions.</td></tr>
<tr><td>.numeral</td><td>Tabular, muted, 12px. Order, never meaning.</td><td>Contact-sheet indices: 01, 07 / 27.</td></tr>
<tr><td>.badge --analogue --digital</td><td>A well with a 6px dot as the sole carrier of identity.</td><td>The medium of a series. Nothing else.</td></tr>
<tr><td>.theme-toggle</td><td>Sunk track, raised knob, back-ease travel.</td><td>Exactly one, with <code>data-theme-toggle</code>.</td></tr>
<tr><td>.grain</td><td>The film-grain overlay.</td><td>Last child of <code>&lt;body&gt;</code>.</td></tr>
<tr><td>[data-reveal]</td><td>Fades up 16px over 900ms on entering the viewport; <code>.reveal-delay-1/2/3</code> stagger a row.</td><td>Groups — cards, tiles, an album head. Never the header or anything above the fold.</td></tr>
</tbody></table></div></section>

<section class="s" id="example"><h2 class="sh">Worked example: a series row</h2><div class="prose"><p>The admin panel lists albums as rows. Build one. It is a link to the album, so the whole row is pressable — which means it is raised, and it lifts on hover like every other raised thing.</p></div>
<h3 class="sh3">1 · Markup</h3>${code('', `<a class="row panel" href="/projects/highlands-scotland">
  <span class="row__cover" role="img" aria-label="Cover of Highlands, Scotland"></span>
  <span class="row__text">
    <span class="row__title">Highlands, Scotland</span>
    <span class="label">24 frames · Analogue</span>
  </span>
  <span class="numeral">01</span>
</a>`)}
<h3 class="sh3">2 · Styles — nothing but tokens</h3>${code('', `.row {
  display: flex; align-items: center; gap: var(--space-4);
  padding: var(--space-3) var(--space-4) var(--space-3) var(--space-3);
  transition: box-shadow var(--dur-hover) var(--ease-out), transform var(--dur-hover) var(--ease-out);
}
.row:hover, .row:focus-visible { box-shadow: var(--neu-shadow-hover); transform: translateY(-1px); }
.row:active { box-shadow: var(--neu-shadow-active); transform: translateY(1.5px) scale(0.99); transition-duration: var(--dur-press); }
.row__cover { width: 72px; height: 54px; border-radius: var(--radius-chip); background: var(--bg-card-image); flex-shrink: 0; }
.row__text  { display: flex; flex-direction: column; gap: var(--space-1); flex: 1; min-width: 0; }
.row__title { font-size: var(--font-size-base); font-weight: 500; letter-spacing: var(--tracking-title); }`)}
<h3 class="sh3">3 · Result</h3>
<div class="stage stage--col"><a class="arow arow--live" href="#/start/build#example"><span class="arow__cover"></span><span class="arow__text"><span class="arow__title">Highlands, Scotland</span><span class="label">24 frames · Analogue</span></span><span class="numeral">01</span></a></div>
<div class="prose"><p>Notice what was <i>not</i> decided: no colour, no shadow values, no timing. The row inherits the press model from the system, so it feels like the buttons beside it, and it re-themes with everything else. The cover radius is the chip radius — smaller than a photograph’s — because at 72px it is a thumbnail, not a print.</p></div></section>

<section class="s" id="extend"><h2 class="sh">Extend the system</h2>
<h3 class="sh3">Adding a token</h3><div class="prose"><p>Only when a value is needed in two places and no existing token fits — one use is a component detail, not a token. Name the role, not the value: <code>--dur-settle</code>, never <code>--dur-380</code>. If it is a colour, define both themes in the same commit. Most proposed tokens turn out to be drift from an existing one; check the <a href="#/tokens"><b>full list</b></a> first.</p></div>
<h3 class="sh3">Adding a component</h3><div class="prose"><ul><li>Start from <a href="#/principles"><b>the principles</b></a>. If it competes with a photograph, reconsider it.</li><li>Give it its own file with scoped styles that read tokens only.</li><li>Pick its surface by grammar before choosing anything else.</li><li>Name it in the darkroom’s vocabulary: exposure, print, frame, loupe, light table.</li><li>Design both themes and reduced motion before calling it done; then add its page here.</li></ul></div>
<h3 class="sh3">Adding a colour</h3><div class="prose"><p>Don’t. There is one accent, tuned per theme, and one red for the analogue marker. A state that seems to need a colour almost always needs the ink at a different weight, or a recessed surface. The restraint is the identity.</p></div>
${dd('<p>Promote a value to a token when a second component asks for it.</p><p>Compose new things from the kit before writing new CSS.</p>', '<p>Do not add a fourth radius, a fourth control size, or a seventh duration without removing one.</p><p>Do not reach for a shadow that is not one of the three pairs.</p>')}</section>
${rel(['start/checklist','Ship checklist'], ['components/button','Button'], ['components/panel','Panel & row'], ['language/elevation','Elevation'], ['tokens','All tokens'])}` };

P['start/checklist'] = { crumb: ['Getting started'], title: 'Ship checklist', lede: 'Run this before anything built on the system goes live. Each line is a decision the system already made; you are checking that you kept it.', body: `
<section class="s" id="list"><h2 class="sh">The list</h2>
<div class="tbl-wrap"><table class="t t--plain t--check"><thead><tr><th>Check</th><th>Why</th><th>How to verify</th></tr></thead><tbody>
<tr><td>Nothing competes with a photograph</td><td>The first principle. Chrome recedes or goes.</td><td>Load the page with a real image in it. Whatever your eye lands on first had better be the picture.</td></tr>
<tr><td>Both themes work</td><td>Every token has a dark value; every component reads tokens.</td><td>Flip the switch. Look for anything that stayed put — a colour that did not change is a literal.</td></tr>
<tr><td>No literals outside the tokens</td><td>Drift starts with one hex.</td><td>Run the audit below. It should list nothing of yours.</td></tr>
<tr><td>Raised is pressable, recessed is not</td><td>The grammar is the only thing that makes elevation mean something.</td><td>Click every raised surface: something happens. Click every well: nothing does.</td></tr>
<tr><td>Keyboard focus is visible</td><td>One ring, in the ink, on everything.</td><td>Tab through the page. The ring is 1px, 4px out, and never missing.</td></tr>
<tr><td>Reduced motion is complete</td><td>Everything snaps; nothing is withheld.</td><td>Turn on Reduce Motion in the OS and reload. The page is all there, immediately.</td></tr>
<tr><td>Touch targets are the control sizes</td><td>36 / 42 / 46px — nothing smaller, nothing in between.</td><td>Nothing tappable is under 36px. The floating control is 46px.</td></tr>
<tr><td>One label voice</td><td>Six drifted sizes were unified in 1.0; do not start again.</td><td>Every uppercase caption is <code>.label</code>. No per-element tracking.</td></tr>
<tr><td>Copy says what happens</td><td>Words are design material.</td><td>Buttons name the action: “Publish”. Toasts confirm in the past tense: “Published”.</td></tr>
<tr><td>Grain is last</td><td>Z-order.</td><td><code>.grain</code> is the last child of <code>&lt;body&gt;</code>; content sits at <code>z-index: 1</code>.</td></tr>
</tbody></table></div></section>

<section class="s" id="audit"><h2 class="sh">A two-minute audit</h2><div class="prose"><p>Three greps that catch most drift before a reviewer does. Run them against your own styles, not the system’s.</p></div>
${code('', `# Hex colours anywhere but a :root block
grep -rnE '#[0-9a-fA-F]{3,8}\\b' src --include='*.css' --include='*.astro' | grep -v ':root'

# Hand-typed durations — every transition should read a --dur-* token
grep -rnE '[0-9.]+m?s\\b' src --include='*.css' --include='*.astro' | grep -vE 'var\\(--dur|--dur-'

# Radii that are not one of the four
grep -rnE 'border-radius:\\s*[0-9]' src --include='*.css' --include='*.astro' | grep -vE 'var\\(--radius|50%'`)}
<div class="prose"><p>A hit is not automatically wrong — a one-off inset shadow inside a component is fine — but every hit should be a decision you can defend in a sentence.</p></div></section>
${rel(['start/build','Build with it'], ['principles','Principles'], ['language/motion','Motion'], ['tokens/changelog','Changelog'])}` };

/* ═══ Router + renderer ═══ */
const $ = (s) => document.querySelector(s);
const route = () => (location.hash.replace(/^#\/?/, '') || '').replace(/\/+$/, '');
const sectionOf = (r) => r.split('/')[0];
const secFor = (r) => NAV.find(n => n.groups.some(g => g.items.some(([h]) => h === r))) || NAV.find(n => n.key === sectionOf(r));

function renderSide(r) {
  const sec = secFor(r);
  const side = $('#side');
  if (!sec) { side.innerHTML = NAV.map(n => '<div class="side__group"><span class="label">' + n.title + '</span>' + n.groups.flatMap(g => g.items).slice(0, 4).map(([h, t]) => '<a href="#/' + h + '">' + t + '</a>').join('') + '</div>').join(''); return; }
  side.innerHTML = sec.groups.map(g => '<div class="side__group"><span class="label">' + g.label + '</span>' + g.items.map(([h, t]) => '<a href="#/' + h + '"' + (h === r ? ' class="is-active"' : '') + '>' + t + '</a>').join('') + '</div>').join('');
}
function renderTop(r) {
  const sec = secFor(r);
  document.querySelectorAll('#topnav a').forEach(a => a.classList.toggle('is-active', !!r && !!sec && secFor(a.getAttribute('href').replace('#/', '')) === sec));
}
function renderHome() {
  $('#main').innerHTML = `
  <div class="hero"><div><p class="label" style="margin-bottom:16px">The design system behind anubhavg.com</p><h1>Quintessence</h1><p class="lede">Photographs first. A tactile, neumorphic chrome that recedes. The vocabulary of the darkroom for everything that isn't a picture.</p></div>
  <div class="hero-meta"><div><span>Version</span><b>1.1</b></div><div><span>Updated</span><b>19 Sep 2026</b></div><div><span>Components</span><b>19</b></div><div><span>Tokens</span><b>62</b></div><div><span>Typeface</span><b>DM Sans</b></div><div><span>Themes</span><b>Light · Dark</b></div></div></div>
  <div class="cards">
    <a class="card" href="#/start"><h3>Getting started</h3><p>Put it on a page in ten minutes: two files, the install order, the kit, a worked example, and the checklist to ship against.</p><span class="label">Start here</span></a>
    <a class="card" href="#/principles"><h3>Principles</h3><p>The six rules the system keeps, extracted from decisions that held across everything that shipped.</p><span class="label">Read first</span></a>
    <a class="card" href="#/language/color"><h3>Design language</h3><p>Color, type, space, shape, elevation, motion, iconography, texture, and theming — with every token.</p><span class="label">9 foundations</span></a>
    <a class="card" href="#/components/button"><h3>Components</h3><p>Nineteen building blocks, rendered live. Usage rules, anatomy, states, and accessibility for each.</p><span class="label">7 groups</span></a>
    <a class="card" href="#/patterns/reveal"><h3>Patterns</h3><p>Behaviours the components share: reveal, the card-to-album morph, deep links, chrome that recedes.</p><span class="label">6 patterns</span></a>
    <a class="card" href="#/tokens"><h3>Tokens</h3><p>The complete reference — every custom property in global.css, by role, with both theme values.</p><span class="label">Reference</span></a>
    <a class="card" href="#/tokens/changelog"><h3>Changelog</h3><p>What changed and why, including the audit that named the system.</p><span class="label">1.0</span></a>
  </div>`;
  $('#rail').innerHTML = '';
}
function renderPage(r, p) {
  const tabs = p.tabs ? '<div class="tabs">' + p.tabs.map((t, i) => '<span' + (i === 0 ? ' class="is-active"' : '') + '>' + t + '</span>').join('') + '</div>' : '<div style="height:28px"></div>';
  $('#main').innerHTML = '<div class="crumb">' + (p.crumb || []).map(c => '<span class="label">' + c + '</span>').join('') + '</div><h1 class="pt">' + p.title + '</h1><p class="lede">' + p.lede + '</p>' + tabs + p.body;
  const heads = [...document.querySelectorAll('#main section.s')].map(s => ({ id: s.id, t: s.querySelector('h2')?.textContent || s.id }));
  $('#rail').innerHTML = heads.length > 1 ? '<span class="label">On this page</span>' + heads.map(h => '<a href="#/' + r + '#' + h.id + '" data-anchor="' + h.id + '">' + h.t + '</a>').join('') : '';
  bindSpecimens();
}
function bindSpecimens() {
  const bloom = $('#bloom'), bt = $('#bloomToggle');
  if (bt) bt.addEventListener('click', () => { const o = bloom.classList.toggle('is-open'); bt.setAttribute('aria-expanded', String(o)); });
  const tw = $('#toastWrap'), sb = $('#shareBtn'); let timer;
  if (sb) sb.addEventListener('click', () => { tw.classList.add('is-on'); clearTimeout(timer); timer = setTimeout(() => tw.classList.remove('is-on'), 3000); });
  const ss = $('#specSwitch'); if (ss) { ss.setAttribute('aria-pressed', String(isDark())); ss.addEventListener('click', flipTheme); }
}
function render() {
  const raw = location.hash.replace(/^#\/?/, '');
  const [r, anchor] = raw.split('#');
  const key = (r || '').replace(/\/+$/, '');
  const p = P[key];
  renderTop(key); renderSide(key);
  if (!p || p.home) renderHome(); else renderPage(key, p);
  $('#side').classList.remove('is-open'); $('#menuBtn').setAttribute('aria-expanded', 'false');
  if (anchor) { const el = document.getElementById(anchor); if (el) el.scrollIntoView(); } else window.scrollTo(0, 0);
  document.title = (p && !p.home ? p.title + ' · ' : '') + 'Quintessence Design System';
}

/* theme */
const root = document.documentElement;
const isDark = () => root.dataset.theme === 'dark' || (!root.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
const syncTheme = () => { document.querySelectorAll('.theme-toggle').forEach(t => t.setAttribute('aria-pressed', String(isDark()))); };
const flipTheme = () => { root.dataset.theme = isDark() ? 'light' : 'dark'; syncTheme(); };
$('#themeToggle').addEventListener('click', flipTheme);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncTheme);
syncTheme();

/* mobile menu */
$('#menuBtn').addEventListener('click', () => { const o = $('#side').classList.toggle('is-open'); $('#menuBtn').setAttribute('aria-expanded', String(o)); });

/* rail highlight on scroll */
const railObs = new IntersectionObserver((entries) => {
  entries.forEach(e => { if (e.isIntersecting) { document.querySelectorAll('#rail a').forEach(a => a.classList.toggle('is-active', a.dataset.anchor === e.target.id)); } });
}, { rootMargin: '-80px 0px -70% 0px' });
const observeSections = () => document.querySelectorAll('#main section.s').forEach(s => railObs.observe(s));

window.addEventListener('hashchange', () => { render(); observeSections(); });
render(); observeSections();
</script>
</body>
